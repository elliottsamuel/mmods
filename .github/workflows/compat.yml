# Test-compiles Find Your Path against other Minecraft versions.
# Runs on pushes to the "compat" branch; each version's log + jar goes to branch ci-compat-<version>.
name: compat
on:
  push:
    branches: [compat]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1.2"
            api: "0.155.3+26.1.2"
          - mc: "26.3"
            api: "0.163.0+26.3"
    defaults:
      run:
        working-directory: find-your-path
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.api }} 2>&1 | tee build.log
        continue-on-error: true
      - name: publish log
        run: |
          OUT=$(mktemp -d)
          cp build.log "$OUT/"
          cp build/libs/*.jar "$OUT/" 2>/dev/null || true
          echo "${{ steps.build.outcome }} ${{ github.sha }} ${{ matrix.mc }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b out
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -q -m "compat ${{ matrix.mc }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" out:ci-compat-${{ matrix.mc }}
