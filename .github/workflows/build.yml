# Builds Find Your Path on every push to main, then saves the build log and the
# finished .jar to the "ci-output" branch so they can be read without the web UI.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: find-your-path
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
        continue-on-error: true
      - name: publish log and jar to ci-output branch
        run: |
          OUT=$(mktemp -d)
          cp build.log "$OUT/"
          cp build/libs/*.jar "$OUT/" 2>/dev/null || true
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${{ github.sha }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: find-your-path
          path: find-your-path/build/libs/
